<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leafmask — Spectial graph</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.34.0/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/layout-base@2.0.1/layout-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cose-base@2.2.0/cose-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
<style>
  :root{
    --bg:#f7f8fa; --panel:#ffffff; --fg:#1b1f24; --muted:#5b6470;
    --border:#e3e7ec; --chip:#eef1f5; --accent:#4f7cff; --warn:#c0392b;
    --shadow:0 8px 30px rgba(20,30,50,.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1117; --panel:#161b22; --fg:#e6edf3; --muted:#9aa4b2;
      --border:#232a33; --chip:#20262e; --accent:#6b8cff; --warn:#ff6b5e;
      --shadow:0 8px 30px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #app{display:grid;grid-template-columns:260px 1fr;height:100%}
  aside{border-right:1px solid var(--border);background:var(--panel);
    padding:18px;overflow:auto}
  aside h1{font-size:16px;margin:0 0 2px}
  aside .sub{color:var(--muted);font-size:12px;margin-bottom:16px}
  #search{width:100%;padding:8px 10px;border:1px solid var(--border);
    border-radius:8px;background:var(--bg);color:var(--fg);margin-bottom:16px}
  .legend h2,.stats h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);margin:16px 0 8px}
  .legend label{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer}
  .legend .sw{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
  .legend .cnt{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
  .stats div{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}
  .stats b{color:var(--fg);font-variant-numeric:tabular-nums}
  #cy{width:100%;height:100%}
  #panel{position:fixed;top:0;right:0;width:min(420px,92vw);height:100%;
    background:var(--panel);border-left:1px solid var(--border);box-shadow:var(--shadow);
    padding:24px;overflow:auto;transform:translateX(100%);transition:transform .22s ease}
  #panel.open{transform:none}
  #panel .close{position:absolute;top:14px;right:16px;border:0;background:none;
    color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
  .ptag{display:inline-block;font-size:11px;font-weight:600;color:#fff;
    padding:2px 8px;border-radius:20px}
  .pid{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
  .badge{display:inline-block;font-size:11px;font-weight:600;background:#f6c945;
    color:#3a2c00;padding:2px 8px;border-radius:20px;margin-left:6px}
  #panel h2.name{font-size:20px;margin:12px 0 4px}
  #panel section{margin-top:18px}
  #panel section h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);margin:0 0 8px}
  .chip{display:inline-block;background:var(--chip);border:1px solid var(--border);
    border-radius:20px;padding:2px 10px;margin:0 6px 6px 0;font-size:12px}
  .chip.warn{background:transparent;border-color:var(--warn);color:var(--warn)}
  ul.crit{margin:0;padding:0;list-style:none}
  ul.crit li{padding:4px 0 4px 22px;position:relative}
  ul.crit li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:700}
  .mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);
    display:block;padding:2px 0}
  .depbtn{display:inline-block;background:var(--chip);border:1px solid var(--border);
    border-radius:8px;padding:3px 10px;margin:0 6px 6px 0;font-size:12px;cursor:pointer;color:var(--fg)}
  .depbtn:hover{border-color:var(--accent)}
  .kv{margin:0 0 8px}.kv b{color:var(--fg)}
  .empty{color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1 id="prodname">Leafmask</h1>
    <div class="sub">Spectial feature graph</div>
    <input id="search" type="search" placeholder="Search features…" autocomplete="off">
    <div class="stats"><h2>Overview</h2>
      <div><span>Features</span><b id="s-feat">0</b></div>
      <div><span>Domains</span><b id="s-dom">0</b></div>
      <div title="A god node is a feature in the top quartile by number of dependents (at least 2) — the widest blast radius if changed."><span>God nodes</span><b id="s-god">0</b></div>
    </div>
    <div class="legend"><h2>Domains</h2><div id="legend"></div></div>
  </aside>
  <div id="cy"></div>
</div>
<section id="panel" hidden><button class="close" id="pclose">×</button><div id="pbody"></div></section>
<script>
const GRAPH = {"generated_at": "2026-07-26", "product": "Leafmask", "nodes": [{"id": "bench.throughput", "name": "Measure dump and restore throughput", "level": "user-facing", "domain": "bench", "depended_on_by": 0, "depends_on_count": 2, "god_node": false, "feature": {"id": "bench.throughput", "name": "Measure dump and restore throughput", "description": "The operator can measure how fast dumps and restores actually run on their deployment, by seeding synthetic customer-shaped documents at chosen volumes, timing a real dump and restore of them, and printing a results table.", "level": "user-facing", "access": {"actors": ["operator"], "authentication": "required", "notes": "Needs a MongoDB URI with rights to create and drop the dedicated bench database. Destructive within that one database only, and guarded (see acceptance)."}, "depends_on": ["dump.create", "restore.database"], "acceptance": ["For each requested document count, the bench seeds that many synthetic documents, dumps them with gzip to a temporary local directory, restores them into an empty database, and times both phases", "The synthetic document is deterministic — the same index always yields the same document — and customer-shaped: about ten fields covering identity, contact, an embedded address, status, a date, and numeric counters", "Results are printed as a table of document count, dump time, restore time, dump size, and documents per second, either aligned text or markdown", "Larger volumes can be linearly extrapolated from the largest measured run and are explicitly marked as estimates in the output", "The bench refuses to touch its dedicated database if that database exists, is non-empty, and does not carry the marker collection a previous bench run would have left — so it can never wipe a database it did not create", "Every database the bench creates carries that marker, so an interrupted run is recognized and auto-cleaned by the next one instead of blocking it", "A restore that does not insert exactly the seeded number of documents fails the bench rather than reporting a misleading figure", "Unless explicitly kept, the bench database and its temporary work directory are removed after the run", "The bench needs only a MongoDB URI: a config file is optional, but a config file that exists and fails to parse is a real error rather than being treated as absent", "A requested size that is not a positive integer document count is rejected before any database work"], "code": ["src/bench.rs", "src/cli.rs"], "tests": ["src/bench.rs"], "api": ["leafmask bench [--sizes 100000,1000000] [--estimate 10000000] [--markdown] [--keep]"], "implementation": {"observability": "Logs one line per size before seeding, naming the document count and target namespace, since seeding millions of documents is otherwise a long silence.", "performance": "Seeding inserts in batches of 1000; the restore uses the same batch size, so the measured figures reflect the batched write path rather than per-document round-trips. Storage is a local directory, so the numbers exclude any network cost.", "reliability": "The bench database is guarded (and dropped) once per size rather than once per run, so consecutive sizes cannot accumulate documents from the previous size when the run is asked to keep its data."}, "notes": "Fixed names: database `leafmask_bench`, data collection `clients`, marker\ncollection `leafmask_bench_marker`. Defaults: sizes 100000,1000000 with\n10000000 extrapolated.\nThe `bench` command is compiled only with the `mongo` cargo feature; without\nit, invoking it fails fast with a message telling the operator to rebuild.\nThe results published in the project README come from this command.\n", "confidence": "high"}}, {"id": "catalog.list-transformers", "name": "List available transformers", "level": "user-facing", "domain": "catalog", "depended_on_by": 0, "depends_on_count": 2, "god_node": false, "feature": {"id": "catalog.list-transformers", "name": "List available transformers e, not as an empty section", "A custom transformer declared in the config can be shown the same way, including its own declared typed parameters", "Showing an unknown name fails with a clear not-found error naming what was asked for"], "code": ["src/catalog.rs", "src/cli.rs"], "tests": ["src/catalog.rs"], "api": ["leafmask show-transformer <name>"], "confidence": "high"}}, {"id": "config.loading", "name": "Configuration file loading", "level": "infrastructure", "domain": "config", "depended_on_by": 4, "depends_on_count": 0, "god_node": true, "feature": {"id": "config.loading", "name": "Configuration file loading", "description": "The product loads its whole behaviour from a single YAML configuration file, located via a --config flag or the LEAFMASK_CONFIG environment variable, with environment-variable interpolation inside values and unknown keys rejected outright.", "level": "infrastructure", "depends_on": [], "acceptance": ["A config file passed via --config is read, interpolated, and decoded into the running configuration", "When --config is not passed, the LEAFMASK_CONFIG environment variable locates the config file instead; with neither, commands that need a config fail with an explicit error rather than a silent default", "Every ${VAR} occurrence in the file is replaced with that environment variable's value before parsing; a referenced-but-undefined variable expands to the empty string instead of failing", "Interpolation is character-safe: non-ASCII/multibyte content anywhere in the file (a password, an accented path) survives unchanged", "An unknown top-level or section key is rejected as an error naming the offending key, never silently ignored", "Transformer parameter names keep their original casing and declaration order on iteration, and are additionally resolvable case-insensitively", "An absent or empty `common.salt` resolves to a fixed public default salt and is flagged as such, so callers can warn that deterministic anonymization is reversible"], "code": ["src/config.rs"], "tests": ["src/config.rs"], "notes": "Config surface parsed into typed structs: `common` (tmp_dir, salt),\n`mongodb` (uri), `storage` (type + flattened backend params), and\n`resolved_warnings`. The `dump`, `restore`, `custom_transformers`,\n`virtual_references`, and `validate` sections are held as raw YAML values and\nre-parsed by the features that own them (dump filters, subset_conds,\ntransformation, restore scripts/exclusions, custom transformers, the\nreference graph) — which is why an unknown key inside one of those sections\nonly surfaces when that feature parses it.\nBecause the root struct denies unknown fields, any config key no feature\ndeclares is a hard parse error.\nSalt fallback constant: `common.salt` unset -> `\"leafmask\"` (public, hence\nreversible). See `Common::resolve_salt`, whose second return value drives the\nCLI's default-salt warning.\n", "confidence": "high"}}, {"id": "dump.create", "name": "Create a logical database dump", "level": "user-facing", "domain": "dump", "depended_on_by": 1, "depends_on_count": 6, "god_node": false, "feature": {"id": "dump.create", "name": "Create a logical database dump", "description": "The operator can produce a logical backup of a MongoDB deployment — documents, indexes, and collection options — filtered by database and collection, transformed inline, optionally gzip-compressed, and optionally dumped several collections at a time.", "level": "user-facing", "access": {"actors": ["operator"], "authentication": "required", "notes": "No application-level authorization: whatever the supplied MongoDB URI and storage credentials permit is what the dump can read and write."}, "depends_on": ["config.loading", "mongo.access-layer", "dump.storage-format", "transform.apply-transformations", "subset.condition-filtering", "subset.database-subsetting"], "acceptance": ["Running the dump command against a reachable deployment produces a dump in the configured storage, identified by a timestamp-derived id, and reports that id and the dump's total size", "Database and collection include/exclude filters restrict what is dumped; a filter given on the command line replaces the configured one entirely, an omitted one falls back to the config", "Index definitions and collection options (validators, capped settings, …) are captured per collection unless index capture is explicitly disabled", "Binary and large field values are captured as BSON binary inline with their owning document, with no separate GridFS pass", "Collection data can be gzip-compressed on the way out", "Several collections can be dumped concurrently, and a concurrent dump produces metadata identical to a sequential one — same document counts, same restore order (source enumeration order, not completion order), same total size", "A failure while dumping one collection fails the whole run with that error, and no spool file or in-flight upload is left behind — including for collections that succeeded alongside the failure", "If `common.tmp_dir` is not configured, the dump fails fast with an explicit error before touching the database", "When transformations are configured but no salt is, the operator is warned that anonymization is running with the public default salt and is therefore reversible; with no transformations configured, no such warning is emitted", "MongoDB's own catalog namespaces (`system.*`) and the admin/config/local databases are never dumped as user data"], "code": ["src/cli.rs", "src/dump/create.rs", "src/mongo.rs"], "tests": ["src/dump/create.rs", "src/cli.rs", "tests/mongo_integration.rs"], "api": ["leafmask dump [--gzip] [--include-db] [--exclude-db] [--include-collection] [--exclude-collection] [--jobs N] [--no-indexes]"], "implementation": {"concurrency": "`--jobs N` (default 1) runs N scoped worker threads pulling collections off a shared atomic cursor. The source and the storage handle are shared across threads. On the first failure no new collection is claimed, but collections already claimed run to completion, so a mid-dump error never cuts off a spool file or an upload in progress.", "observability": "Progress is logged every 100,000 documents per collection, plus one line per database and one summary line per collection (`N documents`, or `N of M documents` when a filter dropped some). A failure inside a parallel worker is logged immediately, because it may be some time before it surfaces as the run's final error.", "performance": "Documents are streamed from the source cursor, transformed, and written one at a time — a collection is never materialized. Per-collection query filters are pushed down to MongoDB so a narrow filter does not require fetching the whole collection.", "reliability": "A dump only writes its metadata once every collection has succeeded; on failure the run returns the error and no metadata document is written, so a partial dump is never resolvable as `latest`."}, "notes": "Reads use a plain `find`, so a dump is NOT a point-in-time snapshot: a\ncollection written concurrently can be dumped inconsistently. Snapshot read\nconcern would require a replica set and is deliberately not used.\nCompression is gzip only (flate2, default level); there is no parallel-gzip\nvariant.\nThe `dump` command is compiled only with the `mongo` cargo feature; without\nit, invoking it fails fast with a message telling the operator to rebuild.\n", "confidence": "high"}}, {"id": "dump.storage-format", "name": "On-storage dump format", "level": "infrastructure", "domain": "dump", "depended_on_by": 6, "depends_on_count": 1, "god_node": true, "feature": {"id": "dump.storage-format", "name": "On-storage dump format", "description": "The product defines the format a dump takes in storage — a metadata/table-of-contents document plus, per collection, a streamable document blob and a separate structure blob — so dumps can be written, listed, inspected, and restored without any command ever holding a whole collection in memory.", "level": "infrastructure", "depends_on": ["storage.backend-selection"], "acceptance": ["A dump is identified by a timestamp-derived id and carries a metadata document recording its status (done / failed / in-progress / unknown), creation timestamp, total size, and a per-database, per-collection table of contents with document counts, index names, and a restore order", "A collection's documents are stored as a plain concatenation of BSON documents, never wrapped in one enclosing document, so a collection is not capped by the 2 GiB single-document limit and can be read incrementally", "A collection's structure (indexes, validator, collection options, document count) is stored in a separate small blob beside the data, so reading structure never requires reading documents", "Documents can be read back one at a time or in fixed-size batches, transparently handling both the plain and gzip-compressed variants of the data blob", "A truncated or corrupt data blob is reported as a clear corruption error instead of being partially accepted, and a declared document length outside 5 bytes to 64 MiB is rejected rather than attempted as an allocation", "The reference `latest` resolves to the most recently created dump whose status is done; an unknown dump id is a clear not-found error", "A dump whose metadata cannot be read still appears in listings as an unknown-status entry rather than failing the whole listing", "A writer abandoned without being finished cleans up after itself — the local spool file is removed, or the in-flight multipart upload is aborted — instead of leaving either behind"], "code": ["src/dump/mod.rs"], "tests": ["src/dump/mod.rs"], "implementation": {"performance": "Both the writer and the reader are streaming: the writer appends one document at a time into either a backgrounded multipart upload (when the backend offers one) or a local spool file uploaded whole at the end; the reader yields documents one at a time. Memory is bounded per document, never per collection.", "reliability": "The writer's cleanup-on-drop path is careful about gzip specifically: the encoder's own drop would otherwise write a trailer into an already-removed spool file or an already-aborted upload, so the trailer is landed first and only then is the underlying sink cleaned up."}, "notes": "Layout inside a dump: `<id>/metadata.json`,\n`<id>/data/<db>/<collection>.bson` (or `.bson.gz`) for documents, and\n`<id>/data/<db>/<collection>.meta.bson` for structure.\nSpool file names embed the process id and a per-process counter so concurrent\ndumps (and parallel tests) never share one.\n", "confidence": "high"}}, {"id": "dumpmgmt.delete-dump", "name": "Delete or prune dumps", "level": "user-facing", "domain": "dumpmgmt", "depended_on_by": 0, "depends_on_count": 1, "god_node": false, "feature": {"id": "dumpmgmt.delete-dump", "name": "Delete or prune dumps", "description": "The operator can delete one dump by id, or prune several at once by retention policy — keeping only the N most recent, deleting everything before a date, and/or removing failed and unknown-status dumps — with a dry run to preview what would go.", "level": "user-facing", "access": {"actors": ["operator"], "authentication": "required", "notes": "Requires whatever credentials the configured storage backend needs; no MongoDB connection is involved. Destructive: there is no confirmation prompt, the dry run is the only safeguard."}, "depends_on": ["dump.storage-format"], "acceptance": ["Deleting by explicit id removes that dump and only that dump; deleting an id that is not in storage is a clear error, not a silent no-op", "Keeping only the N most recent completed dumps protects those N from every other rule and selects every other completed dump for deletion", "Keeping the 0 most recent selects every completed dump — the literal reading, not a no-op", "Deleting before a given date selects every dump created strictly before it; an invalid date is rejected before anything is deleted", "Pruning failed dumps selects dumps whose status is failed; additionally pruning unsafe ones also selects unknown and in-progress dumps", "A dry run reports exactly the ids that would be deleted and leaves storage untouched", "Selection is deterministic: the same set of dumps and the same policy always yield the same sorted list of ids"], "code": ["src/dump/management.rs", "src/cli.rs"], "tests": ["src/dump/management.rs"], "api": ["leafmask delete [--id ID] [--retain-recent N] [--before-date RFC3339] [--prune-failed] [--prune-unsafe] [--dry-run]"], "notes": "The retention policy also carries a \"retain for a duration\" rule, used and\ntested at the library level, but the CLI exposes no flag for it — only\n--retain-recent, --before-date, --prune-failed and --prune-unsafe reach it.\nA dump whose recorded creation timestamp is unparseable is treated as the\nUnix epoch, so it falls outside every retention window and is a prune\ncandidate.\nAvailable in the default build — no MongoDB feature required.\n", "confidence": "high"}}, {"id": "dumpmgmt.list-dumps", "name": "List dumps in storage", "level": "user-facing", "domain": "dumpmgmt", "depended_on_by": 0, "depends_on_count": 1, "god_node": false, "feature": {"id": "dumpmgmt.list-dumps", "name": "List dumps in storage", "description": "The operator can list every dump held in the configured storage with its id, completion status, and size.", "level": "user-facing", "access": {"actors": ["operator"], "authentication": "required", "notes": "Requires whatever credentials the configured storage backend needs; no MongoDB connection is involved."}, "depends_on": ["dump.storage-format"], "acceptance": ["Listing a storage containing dumps prints one line per dump with its id, status, and size in bytes", "Dumps are listed in id order, which for timestamp-derived ids is chronological", "An empty storage produces an empty listing rather than an error", "A dump whose metadata is missing or unreadable is still listed, with unknown status, instead of failing nd write side rather than a wrapped external dump/restore tool, so documents can be transformed inline while streaming and every consumer can be tested against an in-memory stand-in.", "level": "infrastructure", "depends_on": [], "acceptance": ["The read side can enumerate databases and collections, read a collection's structure without reading any of its documents, stream a collection's documents one at a time, and read a bounded sample", "System databases (admin, config, local) and MongoDB's own catalog namespaces are excluded from enumeration, so they are never treated as user data", "A filter can be pushed down to the read side so the server does the narrowing, rather than every document being fetched and discarded afterwards", "A projection can be pushed down alongside the filter, so a caller that needs only a few fields per document pays for those fields rather than the whole document", "The write side can create a collection applying its validator and options, insert a batch of documents ordered or unordered, create an index, and drop a collection", "Creating a collection that already exists, or dropping one that does not, succeeds rather than erroring", "A batch insert reports per-document failures as data, not as a failed call: an ordered batch stops at its first failure and reports how many went in before it, an unordered batch attempts every document and reports all failures; only a whole-batch failure such as a lost connection is an error", "A duplicate-key failure carries both the error code and the name of the offending index, recovered from the server message", "An index round-trips through the abstraction with its ordered key specification, direction, uniqueness, and name, defaulting the name from the keys when the server does not supply one", "Both sides are safe to share across worker threads, so a parallel dump or restore uses one connection handle"], "code": ["src/mongo.rs", "src/error.rs"], "tests": ["tests/mongo_integration.rs", "src/mongo.rs"] bset/mod.rs", "src/config.rs", "src/cli.rs"], "tests": ["src/subset/virtual_references.rs", "src/config.rs", "src/cli.rs"], "notes": "Declaration shape the parser accepts (a list of entries):\n  - collection: <holding collection>\n    references:\n      - field: <field on the holding collection>\n        references_collection: <target>        # omitted when polymorphic\n        references_field: <target field>       # default \"_id\"\n        not_null: <bool>                       # default false\n        polymorphic_exprs:\n          - {field: <discriminator>, value: <literal>, references_collection: <target>}\n\nDeclared under the top-level `virtual_references` key. An absent section\nyields an empty graph, which turns off both referential subsetting and\ntransformation propagation; a malformed one is a configuration error naming\nthe section.\nPolymorphic targets are modelled as `field == value -> collection` cases,\nwhich covers the discriminator use of the free-form expressions in the tool\nthis product base came from — see .spectial/regeneration-gaps.md.\n", "confidence": "high"}}, {"id": "transform.apply-transformations", "name": "Apply configured transformations while dumping", "level": "internal", "domain": "transform", "depended_on_by": 2, "depends_on_count": 5, "god_node": true, "feature": {"id": "transform.apply-transformations", "name": "Apply configured transformations while dumping", "description": "The product rewrites document field values as they stream out of MongoDB, following the per-collection, per-field transformer rules declared in the config, so a dump is anonymized rather than a verbatim copy of production data.", "level": "internal", "depends_on": ["transform.builtin-transformers", "transform.custom-transformers", "transform.parameter-framework", "transform.dynamic-parameters", "transform.transformation-condition"], "acceptance": ["The whole configuration is compiled into an executable plan once, before any document is read, so a bad transformer name, an invalid parameter, an unknown type override, or a malformed condition fails before the dump touches data", "For each configured collection, each rule's transformer runs on its target field as documents stream by; collections with no entry are dumped unmodified", "A target field is addressed by dotted path, and writing a dotted path creates the intermediate embedded documents it needs", "A field absent from a document is presented to its transformer as null rather than skipped", "A rule can override the field's logical type before the transformer runs, so a transformer can operate on a type other than the field's native one", "A collection can carry a query restricting which of its documents are dumped at all, independently of which fields get transformed", "The plan can report which fields have a transformer configured for a given collection, which is what drives the preview's transformed-only view"], "code": ["src/transform/apply.rs"], "tests": ["src/transform/apply.rs", "src/dump/create.rs"], "implementation": {"performance": "Rules with only static parameters are built once at compile time and reused for every document; only rules with dynamic parameters are rebuilt per document. The compiled plan is shared read-only across the dump's worker threads."}, "notes": "Config shape under `dump.transformation`: a list of\n`{collection, when?, query?, transformers: [...]}` where each transformer rule\nis `{field|column, name, params?, when?, dynamic_params?,\napply_for_references?, type_override?}`. Unknown keys in either shape are\nrejected.\n\nTwo distinct filtering mechanisms coexist and must not be conflated:\nthe collection-level `query` is an offline, equality-only matcher applied per\ndocument in the dump loop, while `dump.subset_conds` is compiled to a native\nMongoDB filter and pushed to the server. A collection can carry both.\n\n`apply_for_references` is parsed on a rule here but never consumed by this\nplan — see transform.transformation-inheritance.\n", "confidence": "high"}}, {"id": "transform.builtin-transformers", "name": "Built-in transformer library", "level": "internal", "domain": "transform", "depended_on_by": 3, "depends_on_count": 2, "god_node": true, "feature": {"id": "transform.builtin-transformers", "name": "Built-in transformer library", "description": "The product ships a library of built-in transformers — hashing, deterministic generation, noise, masking, regexp replacement, fixed replacement, nulling, and templating — each registered by name with typed parameters and operating natively on BSON values.", "level": "internal", "depends_on": ["transform.parameter-framework", "transform.hash-engine"], "acceptance": ["Every built-in is registered under a unique name with a description and a typed parameter list, all discoverable through the transformer catalog", "Hash- and generation-based transformers produce the same output for the same input and salt across separate instantiations and runs", "Noise transformers perturb a value within a configurable bound while preserving its BSON type — an integer stays an integer, a date stays a date", "A transformer producing structured output populates several related fields consistently with each other (a generated person's email is derived from that same person's generated names)", "An ObjectId-valued field can be transformed into a different but still valid ObjectId", "A transformer given a value of a type it cannot handle fails with a clear error naming what it needed, rather than silently producing garbage", "A transformer may read sibling fields of the document it is transforming, not only the target field's own value"], "code": ["src/transform/mod.rs", "src/transform/builtin.rs"], "tests": ["src/transform/builtin.rs"], "notes": "Complete catalog as implemented (16 transformers), with parameters —\nthis is the full inventory, not a sample:\n\n  hash(length: int = 16)              hex hash of the input, truncated\n  random_int(min: int!, max: int!) nternal", "depends_on": ["transform.parameter-framework"], "acceptance": ["A command-driver custom transformer spawns the configured executable once and exchanges one record per line with it over stdin/stdout, reusing the same live process for every subsequent record", "A template-driver custom transformer renders its configured template against the current document", "Custom transformers are registered alongside the built-ins, appear in the catalog the same way, and can declare their own typed parameters", "A custom transformer with an unknown driver, a command driver with no command, or a template driver with no template is rejected as a configuration error naming the transformer", "An external process that exits or produces no output for a record fails the transformation with an error naming the offending transformer, rather than silently producing a null", "Output the external process produces that cannot be decoded is a clear error, not a silently mangled value", "The external process is terminated when its transformer is dropped, so a failed or finished dump leaves no orphan process behind"], "code": ["src/transform/custom.rs"], "tests": ["src/transform/custom.rs"], "notes": "Config shape under `custom_transformers`: a list of\n`{name, description?, driver, command?, template?, parameters?}` where driver\nis `command` or `template`, and each parameter is `{name, type, required?}`\nwith type one of int/float/bool/objectId/datetime (anything else is treated\nas string).\n\nWire protocol for the `command` driver — one line per record, both ways:\nthe field's value is serialized as a single JSON value and written with a\ntrailing newline; the process must answer with exactly one JSON value on one\nline, which becomes the new field value. The mapping is scalar-only plus\narrays and objects; BSON types with no JSON equivalent (ObjectId, DateTime,\nDecimal128, Binary) are sent as their string rendering and therefore come\nback as strings. Access is serialized behind put for per-document consistency."}, "notes": "Config shape: `dynamic_params: {<parameter name>: {field: <dotted path>}}`\non a transformer rule; `column` is accepted as an alias for `field`.\nThe known-field validation is a library entry point that the CLI's dump path\ndoes not currently call — in a real dump an unknown field surfaces at\ntransform time as the per-document \"absent from the document\" error instead.\n", "confidence": "high"}}, {"id": "transform.hash-engine", "name": "Deterministic hash-based value generation", "level": "infrastructure", "domain": "transform", "depended_on_by": 1, "depends_on_count": 0, "god_node": false, "feature": {"id": "transform.hash-engine", "name": "Deterministic hash-based value generation", "description": "The product derives every pseudo-random replacement value from a hash of the original value and a configured salt, so masking a given input always yields the same output — across runs, machines, and parallel workers.", "level": "infrastructure", "depends_on": [], "acceptance": ["The same input and the same salt always produce the same output, regardless of when, where, or on which thread the generation runs", "Different salts produce different output for the same input", "The hash can be projected into the shapes higher-level transformers need: raw bytes of any requested length, an unsigned 64-bit integer, a non-negative signed 64-bit integer, an inclusive integer range, and an index into a list", "Byte output longer than one digest stays deterministic, by extending the stream with a counter rather than by any stateful generator", "A projection into an inclusive range always lands within the bounds and, over many inputs, covers the whole span; a degenerate range returns its lower bound", "An index projection always lands inside the list, and an empty list yields index zero rather than a panic"], "code": ["src/hash.rs"], "tests": ["src/hash.rs"], "implementation": {"notes": "Determinism comes purely from SHA-256(salt || in ing", "An empty expression is rejected at configuration time", "Numeric comparisons coerce across integer and floating-point forms, so an integer field compares correctly against a float literal and vice versa", "A datetime field can be compared against a quoted RFC3339 literal, on both equality and ordering", "The same expression can be translated into a native MongoDB filter, so a condition used for document selection is pushed to the server instead of being evaluated over every fetched document", "A quoted RFC3339 literal becomes a real datetime value in the translated filter — including inside a list — so a date comparison actually matches server-side instead of comparing against a string", "A word operator only matches on identifier boundaries, so a field name that merely contains an operator as a substring is not misparsed"], "code": ["src/transform/condition.rs"], "tests": ["src/transform/condition.rs"], "notes": "Complete expression grammar as implemented — this is the whole surface,\nand it is deliberately a subset of the expression language of the tool this\nproduct base came from (see .spectial/regeneration-gaps.md):\n\n  term    := <path> <cmp> <literal>\n           | <path> (\"in\" | \"not in\") \"[\" <literal> (\",\" <literal>)* \"]\"\n           | <path>                          (bare field -> truthiness)\n  cmp     := \"==\" | \"!=\" | \">=\" | \"<=\" | \">\" | \"<\"\n  expr    := term (\" and \" term)* (\" or \" ...)*     -- `and` binds tighter\n  path    := field (\".\" field)*\n  literal := 'quoted' | \"quoted\" | true | false | null | int | float\n           | bare-token (falls back to a string)\n\nNOT supported: parentheses, arithmetic, negation of a whole term, functions,\nregex operators, comparisons between two fields.\n\nTruthiness for a bare field: false for absent, null, false, empty string, and\nnumeric zero; true otherwise. The translated MongoDB filter reproduces this as\n`{$exists: true, $nin: [null, false, 0, \"\"]}`.\n\nOperator-to-MongoDB mapping used by the translation: `==` -> direct equality,\n`!=` -> $ne, `>` -> $gt, `<` -> $lt, `>=` -> $gte, `<=` -> $lte,\n`in` -> $in, `not in` -> $nin, `and` -> $and, `or` -> $or (a single-term\ngroup is emitted unwrapped).\n\nSplitting and operator search are quote-aware, so a separator or operator\ninside a quoted literal is never treated as syntax.\n", "confidence": "high"}}, {"id": "transform.transformation-inheritance", "name": "Transformation propagation to referencing fields", "level": "internal", "domain": "transform", "depended_on_by": 0, "depends_on_count": 1, "god_node": false, "feature": {"id": "transform.transformation-inheritance", "name": "Transformation propagation to referencing fields", "description": "A transformer marked as applying to references is propagated to every field in other collections that declares a reference to the transformed field, so referencing values stay consistent with the transformed ones without repeating the configuration.", "level": "internal", "depends_on": ["subset.virtual-references"], "acceptance": ["A transformation marked as applying to references produces an additional, identical transformation on every field that declares a reference to the transformed collection and field", "Because the propagated transformation is the identical transformer with identical parameters and salt, an equal input value yields an equal output on both sides of the reference", "A referencing field that already has its own explicitly configured transformation keeps it and is never overridden by a propagated one", "A propagated transformation is marked as such, distinguishable from an explicitly configured one, and does not itself propagate further", "The same referencing field never receives two propagated transformations, even when several reference edges point at the same transformed field", "Without the marker, nothing is propagated; and with no declared reference graph at all, nothing is propagated either", "A propagated transformation reaches the running dump, not merely the configuration: the referencing field is actually rewritten, and rewritten to the same value as the field it references"], "code": ["src/transform/inheritance.rs", "src/transform/apply.rs", "src/cli.rs"], "tests": ["src/transform/inheritance.rs", "src/transform/apply.rs"], "notes": "The expansion runs when the transformation plan is compiled, so a propagated\nrule is a real rule of the plan and is indistinguishable at transform time\nfrom a configured one. Compiling without a reference graph propagates\nnothing, which is what a config with no `virtual_references` gets.\nAn inherited rule copies the source rule's transformer name and parameters\nand nothing else — `when` and `dynamic_params` are deliberately dropped,\nbecause both read fields of the document being transformed and the\nreferencing document is a different document in a different collection;\ncarrying them over would make the two sides diverge, defeating the\nconsistency this feature exists to provide.\nPartition inheritance from the PostgreSQL tool this product base came from is\ndeliberately absent: MongoDB has no table-partitioning equivalent.\n", "confidence": "high"}}, {"id": "validate.schema-diff", "name": "Schema drift detection", "level": "user-facing", "domain": "validate", "depended_on_by": 0, "depends_on_count": 3, "god_node": false, "feature": {"id": "validate.schema-diff", "name": "Schema drift detection", "description": "The operator can compare what a stored dump recorded against the live database now and see the drift — indexes added, removed, or redefined, a changed validator, changed collection options — so drift is caught before it silently breaks a transformation rule or a restore.", "level": "user-facing", "access": {"actors": ["operator"], "authentication": "required", "notes": "Read-only on both sides: needs the storage backend's credentials to read the dump and a MongoDB connection to read the live structure. Nothing is written."}, "depends_on": ["config.loading", "mongo.access-layer", "dump.storage-format"], "acceptance": ["Comparing a dump against the live database reports one readable line per difference, naming the database, the collection, and the specific index or option involved", "An index recorded but absent live is reported as removed, and an index present live but not recorded is reported as added", "An index present on both sides with different keys or a different uniqueness setting is reported as changed", "A differing validator is reported, and so is each collection option whose value differs on one side", "Identical structures produce no drift at all — no false positives — and the operator is told so explicitly rather than getting silence", "A collection the dump recorded that no longer exists live is drift (everything it had is gone), not an error", "A structure read that fails for any other reason propagates, so a connection problem is never silently rendered as 'everything was dropped'", "The comparison defaults to the most recent completed dump and can be pointed at a specific dump id", "The comparison can be narrowed to one database and/or one collection", "In strict mode any detected drift fails the command with a non-zero exit, so a pipeline can gate on it; otherwise the drift is reported and the command succeeds", "Asking for neither report, or for both at once, is an explicit error rather than a silent no-op"], "code": ["src/validate/schema_diff.rs", "src/validate/mod.rs", "src/cli.rs"], "tests": ["src/validate/schema_diff.rs"], "api": ["leafmask validate --schema [--dump <id|latest>] [--database DB] [--collection COLL] [--strict]"], "notes": "Comparison is exact on keys (ordered field/direction pairs), uniqueness, the\nvalidator document, and each option value; index identity is by name.\nThe index type this feature defines is load-bearing well beyond drift\ndetection — it is the index representation the dump records, the restore\nrecreates, and the driver reads bac const PALETTE = ['#4f7cff','#e8562f','#12a594','#c026d3','#d97706',
                 '#0891b2','#65a30d','#db2777','#7c3aed','#0d9488'];
const domains = Object.keys(GRAPH.clusters).sort();
const domainColor = {};
domains.forEach((d,i)=>domainColor[d]=PALETTE[i%PALETTE.length]);

const byId = {};
GRAPH.nodes.forEach(n=>byId[n.id]=n);
const dependents = {};
GRAPH.nodes.forEach(n=>dependents[n.id]=[]);
GRAPH.edges.forEach(e=>dependents[e.to].push(e.from));

const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const SHAPE = {'user-facing':'round-rectangle','internal':'ellipse','infrastructure':'barrel'};

if (window.cytoscapeFcose) cytoscape.use(window.cytoscapeFcose);

const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: [
    ...GRAPH.nodes.map(n=>({data:{id:n.id,label:n.name,domain:n.domain,
      level:n.level,dob:n.depended_on_by,god:n.god_node?1:0}})),
    ...GRAPH.edges.map(e=>({data:{id:e.from+'>'+e.to,source:e.from,target:e.to}})),
  ],
  style:[
    {selector:'node',style:{
      'background-color':ele=>domainColor[ele.data('domain')]||'#888',
      'label':'data(label)','color':dark?'#e6edf3':'#1b1f24',
      'text-outline-width':2,'text-outline-color':dark?'#0d1117':'#ffffff',
      'width':ele=>28+10*ele.data('dob'),'height':ele=>28+10*ele.data('dob'),
      'font-size':11,'text-valign':'bottom','text-margin-y':5,
      'text-wrap':'wrap','text-max-width':120,
      'shape':ele=>SHAPE[ele.data('level')]||'ellipse',
      'border-width':ele=>ele.data('god')?4:0,'border-color':'#f6c945',
    }},
    {selector:'edge',style:{'width':1.5,'line-color':'#8b93a1',
      'target-arrow-color':'#8b93a1','target-arrow-shape':'triangle',
      'curve-style':'bezier','opacity':.55,'arrow-scale':.9}},
    {selector:'.faded',style:{'opacity':.12}},
    {selector:'node.sel',style:{'border-width':4,'border-color':dark?'#e6edf3':'#111'}},
  ],
  layout:{name: window.cytoscapeFcose?'fcose':'cose', animate:false,
    quality:'proof', nodeSeparation:110, idealEdgeLength:90},
});

// --- overview + legend ---
document.getElementById('s-feat').textContent = GRAPH.nodes.length;
document.getElementById('s-dom').textContent = domains.length;
document.getElementById('s-god').textContent = GRAPH.nodes.filter(n=>n.god_node).length;
const legend = document.getElementById('legend');
domains.forEach(d=>{
  const row=document.createElement('label');
  row.innerHTML=`<input type="checkbox" checked data-dom="${d}">`
    +`<span class="sw" style="background:${domainColor[d]}"></span>`
    +`<span>${d}</span><span class="cnt">${GRAPH.clusters[d].length}</span>`;
  legend.appendChild(row);
  row.querySelector('input').addEventListener('change',ev=>{
    cy.nodes(`[domain = "${d}"]`).style('display', ev.target.checked?'element':'none');
  });
});

// --- selection + neighbor highlight ---
function selectNode(node){
  cy.elements().addClass('faded');
  node.closedNeighborhood().removeClass('faded');
  cy.nodes().removeClass('sel'); node.addClass('sel');
  renderPanel(node.id());
}
function selectById(id){
  const node=cy.getElementById(id);
  if(node && node.length){ cy.animate({center:{eles:node},duration:250}); selectNode(node); }
}
function clearSelection(){
  cy.elements().removeClass('faded'); cy.nodes().removeClass('sel'); closePanel();
}
cy.on('tap','node',ev=>selectNode(ev.target));
cy.on('tap',ev=>{ if(ev.target===cy) clearSelection(); });

// --- search ---
document.getElementById('search').addEventListener('input',ev=>{
  const q=ev.target.value.trim().toLowerCase();
  if(!q){ cy.nodes().removeClass('faded'); return; }
  cy.nodes().forEach(nd=>{
    const hit=(nd.data('label')||'').toLowerCase().includes(q)||nd.id().toLowerCase().includes(q);
    nd.toggleClass('faded',!hit);
  });
});

// --- side panel ---
const panel=document.getElementById('panel'), pbody=document.getElementById('pbody');
document.getElementById('pclose').addEventListener('click',clearSelection);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function chips(arr,cls){return (arr&&arr.length)
  ? arr.map(a=>`<span class="chip ${cls||''}">${esc(a)}</span>`).join('')
  : '<span class="empty">—</span>';}
function depbtns(ids){return (ids&&ids.length)
  ? ids.map(id=>`<button class="depbtn" data-goto="${esc(id)}">${esc(byId[id]?byId[id].name:id)}</button>`).join('')
  : '<span class="empty">—</span>';}
function monoList(arr){return (arr&&arr.length)
  ? arr.map(p=>`<code class="mono">${esc(p)}</code>`).join('')
  : '<span class="empty">—</span>';}
function sec(title,html){return `<section><h3>${title}</h3>${html}</section>`;}

function renderPanel(id){
  const n=byId[id], f=n.feature||{}, acc=f.access||{};
  let h=`<span class="ptag" style="background:${domainColor[n.domain]}">${esc(n.domain)}</span>`;
  if(n.god_node) h+=`<span class="badge" title="Many features depend on this one (top quartile of dependents, min 2) — the widest blast radius if changed.">god node</span>`;
  h+=`<h2 class="name">${esc(f.name||n.name)}</h2><div class="pid">${esc(n.id)}</div>`;
  if(f.description) h+=sec('Description',`<div>${esc(f.description)}</div>`);

  let access='';
  if(acc.actors) access+=`<div class="kv"><b>Actors</b><br>${chips(acc.actors)}</div>`;
  if(acc.authentication!=null){
    const none=acc.authentication==='none';
    access+=`<div class="kv"><b>Authentication</b> `
      +`<span class="chip ${none?'warn':''}">${esc(acc.authentication)}</span></div>`;
  }
  if(acc.permissions) access+=`<div class="kv"><b>Permissions</b><br>${chips(acc.permissions)}</div>`;
  if(acc.rules) access+=`<div class="kv"><b>Rules</b><br>`
    +acc.rules.map(r=>`<div class="mono">${esc((r.actors||[]).join(', '))} · ${esc(r.condition||'any')} → ${esc(r.scope)}</div>`).join('')+`</div>`;
  if(acc.notes) access+=`<div class="kv">${esc(acc.notes)}</div>`;
  if(access) h+=sec('Access',access);

  h+=sec('Depends on',depbtns(f.depends_on));
  h+=sec('Depended on by',depbtns(dependents[n.id]));
  if(f.acceptance&&f.acceptance.length)
    h+=sec('Acceptance',`<ul class="crit">${f.acceptance.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`);
  if(f.api) h+=sec('API',monoList(f.api));
  if(f.data) h+=sec('Data',monoList(f.data));
  h+=sec('Code',monoList(f.code));
  if(f.tests) h+=sec('Tests',monoList(f.tests));
  if(f.implementation){
    const impl=Object.entries(f.implementation)
      .map(([k,v])=>`<div class="kv"><b>${esc(k)}</b><br>${esc(v)}</div>`).join('');
    if(impl) h+=sec('Implementation',impl);
  }
  if(f.notes) h+=sec('Notes',`<div>${esc(f.notes)}</div>`);
  if(f.confidence) h+=sec('Confidence',`<span class="chip">${esc(f.confidence)}</span>`);

  pbody.innerHTML=h;
  pbody.querySelectorAll('[data-goto]').forEach(b=>
    b.addEventListener('click',()=>selectById(b.getAttribute('data-goto'))));
  panel.hidden=false; requestAnimationFrame(()=>panel.classList.add('open'));
}
function closePanel(){ panel.classList.remove('open');
  setTimeout(()=>{ if(!panel.classList.contains('open')) panel.hidden=true; },220); }
</script>
</body>
</html>
