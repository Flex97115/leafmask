name: Leafmask
description: "A stateless CLI tool for logical MongoDB database dumping, deterministic data anonymization, synthetic data generation, referentially-intact subsetting, and restoration."
version: 0.1.0
source:
  repo: https://github.com/greenmaskio/greenmask
  extracted_at: "2026-07-18"
stack:
  - "Rust 2021 (rustc 1.97)"
  - "MongoDB access behind MongoSource/MongoSink traits (real mongodb-crate adapter behind the optional `mongo` feature)"
  - "clap (CLI) / serde + serde_yaml (config)"
  - "bson, sha2, flate2, regex, chrono"
  - "Storage: local directory (default); S3 (aws-sdk-s3), Azure Blob, SFTP (ssh2) behind optional cargo features"
conventions:
  - "MongoDB is accessed through the MongoSource/MongoSink traits (no wrapped mongodump/mongorestore), so per-document transformation is applied inline while streaming; the real mongodb-crate driver is an optional feature, an in-memory fake backs the tests"
  - "Storage backends implement a common `Storage` trait, selected at runtime from config (storage.type); the directory backend is always compiled, cloud backends are behind cargo features"
  - "Configuration is a single YAML file (serde_yaml, deny_unknown_fields) with ${VAR} environment interpolation and per-command clap flag/env overrides"
actors:
  - id: operator
    name: Operator
    description: "The person or automated system (e.g. CI/CD pipeline) running the Leafmask CLI with MongoDB and storage-backend credentials. Leafmask has no internal user/auth system of its own — access control is delegated to the database and storage credentials supplied to the CLI."
domains:
  - id: dump
    name: Dump
    description: "Producing logical backups of MongoDB collections, optionally transformed and subset."
  - id: transform
    name: Transformation engine
    description: "Deterministic anonymization/masking/synthetic-data-generation applied to dumped documents."
  - id: subset
    name: Subsetting
    description: "Filtering a database dump down to a referentially-intact subset of documents."
  - id: restore
    name: Restore
    description: "Restoring a stored dump into a target MongoDB database."
  - id: dumpmgmt
    name: Dump management
    description: "Listing, inspecting, and deleting/pruning dumps held in storage."
  - id: validate
    name: Validation
    description: "Previewing and validating transformation configuration and schema drift before running a real dump."
  - id: catalog
    name: Transformer catalog
    description: "Discovering available built-in and custom transformers and their parameters."
  - id: storage
    name: Storage backends
    description: "Pluggable storage abstraction for where dumps are read from and written to."
  - id: config
    name: Configuration
    description: "Loading and interpolating the CLI's YAML configuration file."
