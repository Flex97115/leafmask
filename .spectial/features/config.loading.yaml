id: config.loading
name: Configuration file loading
description: "The product loads its whole behaviour from a single YAML configuration file, located via a --config flag or the LEAFMASK_CONFIG environment variable, with environment-variable interpolation inside values and unknown keys rejected outright."
level: infrastructure
depends_on: []
acceptance:
  - "A config file passed via --config is read, interpolated, and decoded into the running configuration"
  - "When --config is not passed, the LEAFMASK_CONFIG environment variable locates the config file instead; with neither, commands that need a config fail with an explicit error rather than a silent default"
  - "Every ${VAR} occurrence in the file is replaced with that environment variable's value before parsing; a referenced-but-undefined variable expands to the empty string instead of failing"
  - "Interpolation is character-safe: non-ASCII/multibyte content anywhere in the file (a password, an accented path) survives unchanged"
  - "An unknown top-level or section key is rejected as an error naming the offending key, never silently ignored"
  - "Transformer parameter names keep their original casing and declaration order on iteration, and are additionally resolvable case-insensitively"
  - "An absent or empty `common.salt` resolves to a fixed public default salt and is flagged as such, so callers can warn that deterministic anonymization is reversible"
code:
  - "src/config.rs"
tests:
  - "src/config.rs"
notes: |
  Config surface parsed into typed structs: `common` (tmp_dir, salt),
  `mongodb` (uri), `storage` (type + flattened backend params), and
  `resolved_warnings`. The `dump`, `restore`, `custom_transformers`,
  `virtual_references`, and `validate` sections are held as raw YAML values and
  re-parsed by the features that own them (dump filters, subset_conds,
  transformation, restore scripts/exclusions, custom transformers, the
  reference graph) — which is why an unknown key inside one of those sections
  only surfaces when that feature parses it.
  Because the root struct denies unknown fields, any config key no feature
  declares is a hard parse error.
  Salt fallback constant: `common.salt` unset -> `"leafmask"` (public, hence
  reversible). See `Common::resolve_salt`, whose second return value drives the
  CLI's default-salt warning.
confidence: high
