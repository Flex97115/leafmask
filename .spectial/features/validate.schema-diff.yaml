id: validate.schema-diff
name: Schema drift detection
description: "The operator can have validate compare the live database's collection structure (indexes, JSON Schema validators, collection options) against what is recorded in storage/config, to catch drift (e.g. a renamed or dropped index, a changed validator) before it silently breaks a transformation rule."
level: internal
depends_on: []
acceptance:
  - "Running validate with --schema fetches the remote storage's recorded collection structure and diffs it against the live database's indexes and validators"
  - "A detected schema difference is reported to the operator rather than allowed to fail silently later in a dump"
code:
  - "src/validate/schema_diff.rs"
tests:
  - "src/validate/schema_diff.rs (mod tests)"
confidence: medium
