id: storage.backend-selection
name: Pluggable storage backend selection
description: "The product reads and writes dumps through a single storage abstraction, letting the operator pick which physical backend (local directory, S3-compatible, Azure Blob, or SSH/SFTP) is used for a given run purely via config, without any other command needing to know which one is active."
level: infrastructure
depends_on:
  - storage.directory-backend
  - storage.s3-backend
  - storage.azure-backend
  - storage.ssh-backend
acceptance:
  - "Setting storage.type to directory, s3, azure, or ssh in the config selects the matching backend implementation at startup"
  - "Every command that reads or writes dumps (dump, restore, list-dumps, show-dump, delete, validate --schema) works identically regardless of which backend is configured"
  - "An unsupported or misspelled storage.type value fails fast with a clear error instead of silently defaulting"
code:
  - "src/storage/selection.rs"
tests:
  - "src/storage/selection.rs (mod tests)"
confidence: high
