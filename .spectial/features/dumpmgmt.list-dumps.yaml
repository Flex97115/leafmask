id: dumpmgmt.list-dumps
name: List dumps in storage
description: "The operator can list every dump held in the configured storage with its id, completion status, and size."
level: user-facing
access:
  actors: [operator]
  authentication: required
  notes: "Requires whatever credentials the configured storage backend needs; no MongoDB connection is involved."
depends_on:
  - dump.storage-format
acceptance:
  - "Listing a storage containing dumps prints one line per dump with its id, status, and size in bytes"
  - "Dumps are listed in id order, which for timestamp-derived ids is chronological"
  - "An empty storage produces an empty listing rather than an error"
  - "A dump whose metadata is missing or unreadable is still listed, with unknown status, instead of failing the whole listing"
code:
  - "src/dump/management.rs"
  - "src/cli.rs"
tests:
  - "src/dump/management.rs"
api:
  - "leafmask list-dumps"
notes: "Available in the default build — no MongoDB feature required."
confidence: high
