id: transform.dynamic-parameters
name: Dynamic (field-referencing) transformer parameters
description: "The operator can configure a transformer parameter to be derived from another field's value on the same document at transform time, instead of a fixed value, so generated data stays logically consistent (e.g. created_at always before updated_at)."
level: internal
depends_on:
  - transform.parameter-framework
acceptance:
  - "A dynamic_params entry referencing another field resolves to that field's current document value when the transformer runs"
  - "Dynamic parameters are cast to the type the transformer expects, the same way static parameters are"
  - "Configuring a dynamic parameter that references a nonexistent field is reported as a validation error, not a runtime panic"
code:
  - "src/transform/dynamic.rs"
  - "src/toolkit.rs"
tests:
  - "src/transform/dynamic.rs"
confidence: medium
