id: subset.virtual-references
name: Virtual (non-FK) reference declaration
description: "The operator can declare relationships between collections — since MongoDB does not enforce foreign keys in the schema, this is the sole mechanism for expressing them, including polymorphic relationships — so dumping and subsetting can traverse them like a relational database traverses foreign keys."
level: internal
depends_on: []
acceptance:
  - "A virtual_references entry declaring a relationship between two collections is treated by the dependency graph as a reference to follow"
  - "A virtual reference can be marked not_null to affect how strictly the subsetting engine must satisfy it"
  - "A virtual reference with polymorphic_exprs can point to different target collections depending on a discriminator expression"
code:
  - "src/subset/virtual_references.rs"
tests:
  - "src/subset/virtual_references.rs"
confidence: medium
