id: dumpmgmt.show-dump
name: Show a dump's metadata and table of contents
description: "The operator can inspect one dump — by id or `latest` — and see its status, creation time, size, and the databases, collections, document counts, indexes, and restore order it contains."
level: user-facing
access:
  actors: [operator]
  authentication: required
  notes: "Requires whatever credentials the configured storage backend needs; no MongoDB connection is involved."
depends_on:
  - dump.storage-format
acceptance:
  - "Showing an existing dump id prints its status, creation timestamp, size, and per-database table of contents"
  - "Each collection is shown with its document count, index count, restore position, and the names of its indexes, ordered by restore position"
  - "Showing `latest` resolves to the most recently created dump whose status is done"
  - "Showing a nonexistent dump id fails with a clear not-found error naming the id"
code:
  - "src/dump/management.rs"
  - "src/dump/mod.rs"
  - "src/cli.rs"
tests:
  - "src/dump/management.rs"
  - "src/dump/mod.rs"
api:
  - "leafmask show-dump <id|latest>"
notes: "Available in the default build — no MongoDB feature required."
confidence: high
