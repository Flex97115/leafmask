id: catalog.show-transformer
name: Show one transformer's documentation
description: "The operator can look one transformer up by name and see its description and every parameter it takes, with each parameter's type and whether it is required, in order to configure it correctly."
level: user-facing
access:
  actors: [operator]
  authentication: none
  notes: "Reads only the local config file; needs neither a database nor a storage backend, and works with no config at all."
depends_on:
  - transform.builtin-transformers
  - transform.custom-transformers
acceptance:
  - "Showing a known transformer prints its name, description, and one line per parameter with the parameter's name, type, required/optional status, and description"
  - "A transformer that takes no parameters is rendered explicitly as having none, not as an empty section"
  - "A custom transformer declared in the config can be shown the same way, including its own declared typed parameters"
  - "Showing an unknown name fails with a clear not-found error naming what was asked for"
code:
  - "src/catalog.rs"
  - "src/cli.rs"
tests:
  - "src/catalog.rs"
api:
  - "leafmask show-transformer <name>"
confidence: high
