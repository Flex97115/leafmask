name: Claude Code Review

# Automated review on every pull request. This complements ci.yml rather than
# duplicating it: CI proves the code *runs* (lint, tests, the MongoDB version
# matrix, coverage), while this pass reviews the things a test suite cannot
# assert — whether a change is tested at the right layer, whether it weakens an
# invariant, whether an error path silently swallows a failure.
#
# Requires a CLAUDE_CODE_OAUTH_TOKEN repository secret. Without it the steps
# are skipped rather than failed, so forks and contributors without access to
# the secret do not see a permanently red check.

#
# Runs once when a pull request is opened, and on demand after that: comment
# `@claude-review` on the pull request to ask for another pass. `synchronize` is
# deliberately absent — a review per push is mostly re-reading a diff nobody
# changed the substance of, and it is billed against the token owner's account.
on:
  pull_request:
    types: [opened, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Two ways in, each gated separately.
    #
    # `pull_request`: same-repo only. Secrets are unavailable to pull requests
    # from forks, and skipping beats a red check nobody can fix.
    #
    # `issue_comment`: this event runs with the workflow file from the default
    # branch and *does* get the secrets, whoever commented — so the trigger has
    # to be restricted to people who already have write access, or any passer-by
    # on a public repository could spend the token owner's quota at will.
    if: >-
      (
        github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && contains(github.event.comment.body, '@claude-review')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    # `secrets` is not available in a job-level `if`, but it is in a job-level
    # `env`, so the presence check has to be carried down to the steps.
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      # `issue_comment` carries the number under `issue`, not `pull_request`.
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        if: env.HAS_TOKEN == 'true'
        with:
          # An `issue_comment` run would otherwise check out the default branch
          # and review a diff that is empty. Naming the merge ref explicitly
          # gives both triggers the same checkout.
          ref: refs/pull/${{ env.PR_NUMBER }}/merge
          # The review needs the merge base to diff against.
          fetch-depth: 0

      - name: Claude review
        if: env.HAS_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Without this the review is written to the job log and nowhere else:
          # it is what creates the PR comment and wires up the tools to write
          # the findings into it.
          track_progress: true
          prompt: |
            Review this pull request against the repository's own rules.

            Read CLAUDE.md first — especially the "Testing policy" section — and
            hold the diff to it. Leafmask writes anonymized copies of production
            data and restores them into live databases, so weight findings by
            data-safety impact, not by style.

            Prioritise, in order:

            1. Silent data loss or silent data exposure. Anything that can make
               a dump or restore report success while producing an incomplete
               result, or that can let unmasked data reach a dump: an ignored
               error, a swallowed `Result`, a config key that is accepted but
               never read, a count or checksum that is recorded but never
               verified.
            2. Determinism. Transformers must derive output purely from
               `SHA-256(salt || input)` — no RNG, no clock, no shared mutable
               state, no iteration-order dependence. Same input must give the
               same output across runs, machines, and `--jobs` worker threads.
            3. Test layer. Anything touching `MongoDriver`, a `Storage` backend,
               or the on-disk dump format needs an integration test, not just a
               unit test against `InMemoryMongo`. Server-behaviour assertions
               (error codes, catalog shapes, BSON fidelity) belong in
               `tests/mongo_version_matrix.rs` so every supported MongoDB
               release is covered. Flag tests that are weaker than their name
               claims, or that could pass while the behaviour they describe is
               broken.
            4. Overflow and panics on the document path. Release builds have
               overflow checks off, so a wrapping `+` corrupts a dump silently
               instead of panicking. A panic inside a dump worker aborts the
               run mid-stream and leaves a partial dump; prefer a returned
               `Err` that is attributable to a field.
            5. The supported-MongoDB list must stay consistent across
               `SUPPORTED_SERVER_VERSIONS` in tests/support/mod.rs, the
               `integration` matrix in .github/workflows/ci.yml, and
               `DEFAULT_VERSIONS` in scripts/test-mongo-matrix.sh.

            Report only what you can point at in the diff, with a file:line and
            a concrete failure scenario — the input or state that triggers it
            and the wrong result it produces. Do not restate what the code
            does, do not suggest formatting changes (clippy and rustfmt already
            gate those in CI), and do not pad the review with praise. If you
            find nothing that matters, say so in one line.
          claude_args: |
            --max-turns 100
