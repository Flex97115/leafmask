[package]
name = "leafmask"
version = "0.1.0"
edition = "2021"
description = "A stateless CLI tool for logical MongoDB database dumping, deterministic data anonymization, synthetic data generation, referentially-intact subsetting, and restoration."
license = "Apache-2.0"

[[bin]]
name = "leafmask"
path = "src/main.rs"

[lib]
name = "leafmask"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
bson = "2"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["clock", "serde"] }
flate2 = "1"
regex = "1"

# --- optional heavy / external-service dependencies ---
# The real MongoDB driver and the cloud storage backends are feature-gated so the
# default build (core transformation engine + local directory storage) stays lean
# and fully unit-testable without any external service. See regeneration-gaps.md.
mongodb = { version = "3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", optional = true }
azure_storage = { version = "0.20", optional = true }
azure_storage_blobs = { version = "0.20", optional = true }
futures = { version = "0.3", optional = true }
ssh2 = { version = "0.9", optional = true }

[features]
default = []
mongo = ["dep:mongodb", "dep:tokio"]
s3 = ["dep:aws-sdk-s3", "dep:aws-config", "dep:tokio"]
azure = ["dep:azure_storage", "dep:azure_storage_blobs", "dep:tokio", "dep:futures"]
ssh = ["dep:ssh2"]

[dev-dependencies]
tempfile = "3"
